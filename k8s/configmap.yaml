# Non-secret configuration only. The database password belongs in a Secret
# that is NOT committed — see README ("Secrets").
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  labels:
    app: catalog
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  PORT: "8080"
  DB_CONNECT_TIMEOUT: "2"
